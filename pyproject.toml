[project]
name = "nyc311"
version = "0.1.0"
description = "NYC 311 service requests data pipeline (Socrata -> Parquet -> DuckDB -> dbt)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pyarrow>=15",
    "duckdb>=1.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
